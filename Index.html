<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Store — Лабораторная работа 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Управление магазином (DOM Store)</h1>

    <!-- Форма добавления -->
    <form id="add-product-form" novalidate>
      <h2>Добавить товар</h2>
      
      <div class="form-group">
        <label for="product-name">Название товара:</label>
        <input type="text" id="product-name" placeholder="Например, Клавиатура">
        <span class="error-message" id="name-error"></span>
      </div>

      <div class="form-group">
        <label for="product-price">Цена (₸):</label>
        <input type="number" id="product-price" step="0.01" placeholder="Например, 15000">
        <span class="error-message" id="price-error"></span>
      </div>

      <div class="form-group">
        <label for="product-qty">Количество:</label>
        <input type="number" id="product-qty" placeholder="Например, 2">
        <span class="error-message" id="qty-error"></span>
      </div>

      <button type="submit" id="submit-btn">Добавить в магазин</button>
    </form>

    <!-- Список товаров -->
    <section class="products-section">
      <h2>Список товаров</h2>
      <table class="products-table">
        <thead>
          <tr>
            <th>Название</th>
            <th>Цена (₸)</th>
            <th>Количество</th>
            <th>Сумма (₸)</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="products-list">
          <!-- Динамически заполняется через JS -->
        </tbody>
      </table>

      <div class="total-container">
        <span>Общая стоимость (Total): </span>
        <strong id="total-amount">0.00 ₸</strong>
      </div>
    </section>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
